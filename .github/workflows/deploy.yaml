name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # enablement: true creates the Pages site on first run if it doesn't exist
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: withastro/action@v6

  # The build job runs third-party npm code, so only this deploy job is granted
  # the OIDC token (id-token: write) needed by actions/deploy-pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
